<div id="commentArea">
    {% for c in comments %}
    <div class="row">
        <div class="col-md-1 col-xs-4">
            {% if c.user.avatar and c.user.avatar.startswith('https') %}
            <img src="{{ c.user.avatar }}" class="img-fluid rounded-circle" style="width: 60px; height: 60px; object-fit: cover;" alt="avatar" />
            {% else %}
            <img src="{{ url_for('static' ,filename='images/default-avatar.jpg') }}" class="img-fluid rounded-circle" style="width: 60px; height: 60px; object-fit: cover;" alt="avatar" />
            {% endif %}
        </div>
        <div class="col-md-11 col-xs-8">
            <p>{{ c.content }}</p>
            <p><em class="my-date">{{ c.created_date }}</em></p>
        </div>
    </div>
    {% endfor %}

    {% if pages > 1 %}
    <ul class="pagination">
        <li class="page-item {% if page == 1 %}disabled{% endif %}">
            <a class="page-link" href="javascript:void(0);" onclick="loadComments({{ product_id }}, {{ page - 1 }})">Previous</a>
        </li>

        {% for idx in range(1, pages + 1) %}
        <li class="page-item {% if idx == page %}active{% endif %}">
            <a class="page-link" href="javascript:void(0);" onclick="loadComments({{ product_id }}, {{ idx }})">{{ idx }}</a>
        </li>
        {% endfor %}

        <li class="page-item {% if page == pages %}disabled{% endif %}">
            <a class="page-link" href="javascript:void(0);" onclick="loadComments({{ product_id }}, {{ page + 1 }})">Next</a>
        </li>
    </ul>
    {% endif %}
</div>
